<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Prospecção | Sites para Nail Designers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0F0912;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .header-card {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      background: rgba(217, 138, 167, 0.15);
      border: 1px solid rgba(217, 138, 167, 0.35);
      color: #E8A9BF;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.1;
      margin-bottom: 0.8rem;
    }
    p.subtitle {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1rem;
    }

    .generator-panel {
      background: #190F1E;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .full-width { grid-column: span 2; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #E8A9BF;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    input:focus {
      outline: none;
      border-color: #D98AA7;
      background: rgba(255, 255, 255, 0.08);
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .btn-generate {
      width: 100%;
      background: linear-gradient(135deg, #D98AA7 0%, #8E6297 100%);
      color: #FFFFFF;
      border: none;
      padding: 1.1rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(217, 138, 167, 0.35);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(217, 138, 167, 0.5);
    }

    /* Output Results Box */
    .output-card {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
    }
    .output-card.active { display: block; }

    .result-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(217, 138, 167, 0.3);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      position: relative;
    }
    .result-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #E8A9BF;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }
    .link-text {
      font-family: monospace;
      font-size: 0.88rem;
      color: #79FFA8;
      word-break: break-all;
      line-height: 1.4;
    }

    .action-row {
      display: flex;
      gap: 0.8rem;
    }
    .btn-action {
      flex: 1;
      padding: 0.8rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-action:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: #FFFFFF;
    }
    .btn-primary-action {
      background: #25D366;
      border-color: #25D366;
      color: #FFFFFF;
    }
    .btn-primary-action:hover {
      background: #20BA5A;
      border-color: #20BA5A;
    }

    /* Pitch Copy Box */
    .pitch-box {
      margin-top: 1.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.2rem;
    }
    .pitch-text {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
      white-space: pre-line;
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem;
      border-radius: 8px;
      margin-top: 0.6rem;
      border: 1px dashed rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
      .action-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-card">
    <div class="badge">Painel de Vendas & Prospecção</div>
    <h1>Gerador de Demonstrações</h1>
    <p class="subtitle">Gere um link do site 100% personalizado com o nome, Insta e WhatsApp da profissional em 5 segundos!</p>
  </div>

  <div class="generator-panel">
    <div class="form-grid">
      <div class="form-group full-width">
        <label for="inputNome">Nome da Profissional</label>
        <input type="text" id="inputNome" placeholder="Ex: Camila Silva" value="Camila" />
      </div>

      <div class="form-group">
        <label for="inputWhats">WhatsApp (DDD + Número)</label>
        <input type="text" id="inputWhats" placeholder="Ex: 11988887777" value="11999998888" />
      </div>

      <div class="form-group">
        <label for="inputInsta">Instagram (sem @)</label>
        <input type="text" id="inputInsta" placeholder="Ex: camila_nails" value="camilanails" />
      </div>

      <div class="form-group full-width">
        <label for="inputFoto">Foto de Perfil (Opcional - link de imagem)</label>
        <input type="text" id="inputFoto" placeholder="Deixe em branco para usar a foto padrão ou cole um link de imagem" />
      </div>
    </div>

    <button class="btn-generate" onclick="gerarLinkDemo()">
      <span>⚡ Gerar Link Personalizado</span>
    </button>

    <!-- Resultado -->
    <div class="output-card" id="outputCard">
      <div class="result-box">
        <div class="result-title">🔗 Link da Demonstração Pronta</div>
        <div class="link-text" id="demoLinkText">https://...</div>
      </div>

      <div class="action-row">
        <button class="btn-action" onclick="copiarLink()">📋 Copiar Link</button>
        <a href="#" target="_blank" class="btn-action" id="btnTestarLink">👁️ Testar no Navegador</a>
      </div>

      <!-- Script de Abordagem para o Insta/Whats -->
      <div class="pitch-box">
        <div class="result-title">💬 Mensagem Pronta de Abordagem (Instagram / WhatsApp)</div>
        <div class="pitch-text" id="pitchText"></div>
        <button class="btn-action" style="margin-top:0.8rem; width:100%;" onclick="copiarPitch()">📋 Copiar Mensagem de Abordagem</button>
      </div>
    </div>
  </div>
</div>

<script>
  function gerarLinkDemo() {
    const nome = document.getElementById('inputNome').value.trim() || 'Profissional';
    const whats = document.getElementById('inputWhats').value.trim().replace(/\D/g, '') || '5515997949066';
    const insta = document.getElementById('inputInsta').value.trim().replace('@', '') || 'nail_grazii';
    const foto = document.getElementById('inputFoto').value.trim();

    // Monta a base da URL (pega o caminho atual ou do GitHub Pages)
    let baseUrl = window.location.href.split('gerador.html')[0];
    if (!baseUrl.endsWith('/')) baseUrl += '/';
    
    // Constrói os parâmetros
    let params = `?nome=${encodeURIComponent(nome)}&whats=${encodeURIComponent(whats)}&insta=${encodeURIComponent(insta)}`;
    if (foto) {
      params += `&foto=${encodeURIComponent(foto)}`;
    }

    const fullUrl = `${baseUrl}index.html${params}`;

    document.getElementById('demoLinkText').textContent = fullUrl;
    document.getElementById('btnTestarLink').href = fullUrl;

    // Mensagem de abordagem personalizada
    const pitch = `Oi ${nome}, tudo bem? Amei muito os seus trabalhos com nail design no seu feed! 😍\n\n` +
                  `Montei uma demonstração de um site moderno e exclusivo para você ver como ficaria o seu próprio ateliê online com agendamento direto no seu WhatsApp.\n\n` +
                  `Dá uma olhada no que preparei pra você:\n👉 ${fullUrl}\n\n` +
                  `O que você achou? Ficou lindo com o seu nome! 💕`;

    document.getElementById('pitchText').textContent = pitch;

    document.getElementById('outputCard').classList.add('active');
    document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
  }

  function copiarLink() {
    const link = document.getElementById('demoLinkText').textContent;
    navigator.clipboard.writeText(link).then(() => {
      alert('Link copiado com sucesso! Pode enviar pelo Instagram/WhatsApp.');
    });
  }

  function copiarPitch() {
    const pitch = document.getElementById('pitchText').textContent;
    navigator.clipboard.writeText(pitch).then(() => {
      alert('Mensagem de abordagem copiada! Agora é só colar no direct do Instagram ou WhatsApp.');
    });
  }
</script>

</body>
</html>
